<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D Lottery Results</title>
<style>
:root{--bg:#10281f;--panel:#17382c;--line:#2c5a49;--ink:#f6efdc;--mute:#9fb8ab;--gold:#f0b429;--red:#e0553f;--ball:#fff8e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap}
nav b{font-size:1.1rem}
nav .links{display:flex;gap:8px}
a.tab{color:var(--ink);text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:.9rem}
a.tab.on{background:var(--gold);color:#2a1d00;border-color:var(--gold);font-weight:700}
a.tab:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1{font-size:1.6rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:28px 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
.draws{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.draw{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.draw .name{font-weight:700}
.draw .time{color:var(--mute);font-size:.8rem;margin-bottom:10px}
.ball{width:88px;height:88px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--ball) 55%,#e6d9b4);color:#1b1b1b;display:grid;place-items:center;font:800 2.4rem/1 Georgia,serif;box-shadow:0 4px 0 #0a1a14}
.ball.empty{background:transparent;border:2px dashed var(--line);color:var(--mute);box-shadow:none;font-size:1.6rem}
.ball.sm{width:38px;height:38px;font-size:1.05rem;box-shadow:0 2px 0 #0a1a14;margin:0}
.pair{display:flex;gap:8px;justify-content:center}
.pair .ball{margin:0;width:68px;height:68px;font-size:1.9rem}
.pair .ball.sm{width:38px;height:38px;font-size:1.05rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp{margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0c1f18;color:var(--ink);font:inherit}
input.num{text-align:center;font:800 1.6rem Georgia,serif;letter-spacing:.1em}
.row3{margin:14px 0}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;background:var(--gold);color:#2a1d00;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400;padding:6px 10px;font-size:.8rem}
button.danger{color:#ffb4a6}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.9rem}
.msg.err{color:#ffb4a6}.msg.ok{color:#a8e6b9}
.hist{width:100%;border-collapse:collapse}
.hist th,.hist td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
.hist th{font-weight:600;color:var(--mute);font-size:.8rem}
.hist td:first-child,.hist th:first-child{text-align:left;font-size:.9rem}
.scroll{overflow-x:auto}
.dash{color:var(--mute)}
.hide{display:none}
@media(max-width:560px){.draws{grid-template-columns:1fr}.draw{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;text-align:left}.draw .time{margin:0}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <b>2D Lottery</b>
    <div class="links">
      <a class="tab" id="tabDisplay" href="#/display">Results</a>
      <a class="tab" id="tabAdmin" href="#/admin">Admin</a>
    </div>
  </nav>

  <!-- PAGE 1: ADMIN -->
  <section id="pageAdmin" class="hide">
    <div id="login" class="panel">
      <h1>Admin sign in</h1>
      <p class="sub" id="loginHelp">Only the admin can post winning numbers.</p>
      <label for="pin" id="credLabel">Admin PIN</label>
      <input id="pin" type="password" autocomplete="off">
      <p class="msg err" id="loginMsg"></p>
      <button id="loginBtn">Sign in</button>
    </div>

    <div id="adminArea" class="hide">
      <h1>Post winning numbers</h1>
      <p class="sub">Pick a date, then type the 2 winning numbers (00 to 40) for each draw you want to save.</p>
      <div class="panel">
        <label for="date">Date</label>
        <input id="date" type="date">
        <p class="sub" style="margin:6px 0 0;font-size:.8rem">Future dates are not allowed.</p>
        <div class="row3">
          <div class="grp"><label>Morning (2 winning numbers)</label><div class="two">
            <input class="num" id="in_morning_0" maxlength="2" inputmode="numeric" placeholder="--" aria-label="Morning number 1">
            <input class="num" id="in_morning_1" maxlength="2" inputmode="numeric" placeholder="--" aria-label="Morning number 2"></div></div>
          <div class="grp"><label>Afternoon (2 winning numbers)</label><div class="two">
            <input class="num" id="in_afternoon_0" maxlength="2" inputmode="numeric" placeholder="--" aria-label="Afternoon number 1">
            <input class="num" id="in_afternoon_1" maxlength="2" inputmode="numeric" placeholder="--" aria-label="Afternoon number 2"></div></div>
          <div class="grp"><label>Night (2 winning numbers)</label><div class="two">
            <input class="num" id="in_night_0" maxlength="2" inputmode="numeric" placeholder="--" aria-label="Night number 1">
            <input class="num" id="in_night_1" maxlength="2" inputmode="numeric" placeholder="--" aria-label="Night number 2"></div></div>
        </div>
        <button id="saveBtn">Post numbers</button>
        <button class="ghost" id="logoutBtn" style="margin-left:8px">Sign out</button>
        <p class="msg" id="saveMsg"></p>
      </div>
      <h2>Numbers posted each day</h2>
      <div class="panel scroll" id="adminHist"></div>
    </div>
  </section>

  <!-- PAGE 2: DISPLAY -->
  <section id="pageDisplay" class="hide">
    <h1>Winning numbers</h1>
    <p class="sub" id="todayLabel"></p>
    <div class="draws" id="todayDraws"></div>
    <h2>Previous days</h2>
    <div class="panel scroll" id="pubHist"></div>
  </section>
</div>

<script>
// ---- Settings ----
const ADMIN_PIN = "1234";          // used only when testing the file on your own computer
const MAX_NUMBER = 40;             // highest number the admin can post
const CFG = { owner:"", repo:"", branch:"main", path:"data.json" }; // leave owner/repo empty on github.io: they are detected
// ------------------
if(!CFG.owner && location.hostname.endsWith(".github.io")){
  CFG.owner = location.hostname.split(".")[0];
  const seg = location.pathname.split("/")[1];
  CFG.repo = CFG.repo || (!seg || seg.includes(".") ? CFG.owner+".github.io" : seg);
}
const useGit = !!(CFG.owner && CFG.repo);
const DRAWS = [["morning","Morning","9:00 AM"],["afternoon","Afternoon","1:00 PM"],["night","Night","8:00 PM"]];
const KEY="lottery2d_results", AUTH="lottery2d_admin", TOK="lottery2d_token";
let mem={}, memAuth=false, token="";
try{ token = localStorage.getItem(TOK)||""; }catch(e){}
const $ = id => document.getElementById(id);

function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return mem; } }
function save(d){ mem=d; try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
function isAdmin(){ if(useGit) return !!token; try{ return sessionStorage.getItem(AUTH)==="1"; }catch(e){ return memAuth; } }
function setAdmin(v){
  if(useGit){ token = v||""; try{ v ? localStorage.setItem(TOK,v) : localStorage.removeItem(TOK); }catch(e){} return; }
  memAuth=v; try{ v ? sessionStorage.setItem(AUTH,"1") : sessionStorage.removeItem(AUTH); }catch(e){}
}
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pretty(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"}); }

// ---- GitHub storage (numbers live in data.json inside your repo) ----
const fileUrl = `/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;
function api(method,url,body){
  return fetch("https://api.github.com"+url,{method,headers:Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+token},body?{"Content-Type":"application/json"}:{}),body:body?JSON.stringify(body):undefined});
}
async function readRemote(){
  const r = await api("GET",fileUrl+"?ref="+CFG.branch+"&t="+Date.now());
  if(r.status===404) return {data:{},sha:null};
  if(!r.ok) throw new Error("GitHub said "+r.status+". Check the token.");
  const j = await r.json();
  return {data:JSON.parse(atob(j.content.replace(/\n/g,""))||"{}"), sha:j.sha};
}
async function mutate(fn){
  if(!useGit){ const d=load(); fn(d); save(d); return d; }
  for(let i=0;i<2;i++){
    const {data,sha} = await readRemote();
    fn(data);
    const r = await api("PUT",fileUrl,Object.assign({message:"Update lottery numbers",content:btoa(JSON.stringify(data,null,1)),branch:CFG.branch},sha?{sha}:{}));
    if(r.ok){ save(data); return data; }
    if(r.status!==409 && r.status!==422) throw new Error("GitHub said "+r.status+". The token needs Contents: read and write for this repo.");
  }
  throw new Error("Could not save. Please try again.");
}
async function adminData(){ return useGit ? (await readRemote()).data : load(); }
async function publicData(){
  try{ const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"}); if(r.ok) return await r.json(); }catch(e){}
  return load();
}

// ---- Rendering ----
function get(row,k){ const v=row&&row[k]; if(!v) return ["",""]; return typeof v==="string" ? [v,""] : v; }
function ball(v,sm){ return v ? `<div class="ball${sm?" sm":""}">${v}</div>` : `<div class="ball empty${sm?" sm":""}">--</div>`; }
function pair(row,k,sm){ const [a,b]=get(row,k); return `<div class="pair">${ball(a,sm)}${ball(b,sm)}</div>`; }
function histTable(data,withDelete){
  const dates = Object.keys(data).sort().reverse();
  if(!dates.length) return `<p class="sub" style="margin:0">No numbers posted yet.</p>`;
  let h = `<table class="hist"><tr><th>Date</th><th>Morning</th><th>Afternoon</th><th>Night</th>${withDelete?"<th></th>":""}</tr>`;
  for(const d of dates){
    h += `<tr><td>${pretty(d)}</td>`+DRAWS.map(x=>`<td>${pair(data[d],x[0],true)}</td>`).join("")+
      (withDelete?`<td><button class="ghost danger" data-del="${d}" aria-label="Delete ${d}">Delete</button></td>`:"")+`</tr>`;
  }
  return h+"</table>";
}
async function renderDisplay(){
  const data = await publicData(), dates = Object.keys(data).sort();
  const t = dates.length ? dates[dates.length-1] : todayStr(), row = data[t]||{};
  $("todayLabel").textContent = (t===todayStr() ? "Today, " : "Latest results, ")+pretty(t);
  $("todayDraws").innerHTML = DRAWS.map(x=>`<div class="draw"><div class="name">${x[1]}</div><div class="time">${x[2]}</div>${pair(row,x[0])}</div>`).join("");
  const past={}; dates.filter(d=>d!==t).forEach(d=>past[d]=data[d]);
  $("pubHist").innerHTML = histTable(past,false);
}
let adminCache = {};
async function renderAdmin(){
  const ok = isAdmin();
  $("login").classList.toggle("hide",ok);
  $("adminArea").classList.toggle("hide",!ok);
  if(!ok){
    $("credLabel").textContent = useGit ? "GitHub access token" : "Admin PIN";
    $("loginHelp").textContent = useGit ? "Paste your fine-grained token (Contents: read and write for this repo). It stays on this device only." : "Only the admin can post winning numbers.";
    return;
  }
  $("date").max = todayStr();
  if(!$("date").value || $("date").value>todayStr()) $("date").value = todayStr();
  try{ adminCache = await adminData(); }catch(e){ $("saveMsg").className="msg err"; $("saveMsg").textContent=e.message; }
  fillInputs();
  $("adminHist").innerHTML = histTable(adminCache,true);
}
function fillInputs(){
  const row = adminCache[$("date").value]||{};
  DRAWS.forEach(x=>{ const v=get(row,x[0]); $("in_"+x[0]+"_0").value=v[0]; $("in_"+x[0]+"_1").value=v[1]; });
}
function route(){
  const admin = location.hash==="#/admin";
  $("pageAdmin").classList.toggle("hide",!admin);
  $("pageDisplay").classList.toggle("hide",admin);
  $("tabAdmin").classList.toggle("on",admin);
  $("tabDisplay").classList.toggle("on",!admin);
  admin ? renderAdmin() : renderDisplay();
}

// ---- Actions ----
$("loginBtn").onclick = async () => {
  const v = $("pin").value.trim(), m = $("loginMsg");
  if(!useGit){
    if(v===ADMIN_PIN){ setAdmin(true); $("pin").value=""; m.textContent=""; renderAdmin(); } else m.textContent="Wrong PIN. Try again.";
    return;
  }
  m.textContent="Checking...";
  try{
    token = v;
    const r = await api("GET",`/repos/${CFG.owner}/${CFG.repo}`);
    if(!r.ok){ token=""; m.textContent="That token can't open this repo. Check the token and its repo access."; return; }
    setAdmin(v); $("pin").value=""; m.textContent=""; renderAdmin();
  }catch(e){ token=""; m.textContent="Could not reach GitHub. Check your internet."; }
};
$("pin").addEventListener("keydown",e=>{ if(e.key==="Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = () => { setAdmin(false); renderAdmin(); };
$("date").onchange = () => { if($("date").value>todayStr()) $("date").value=todayStr(); fillInputs(); };
DRAWS.forEach(x=>[0,1].forEach(i=>$("in_"+x[0]+"_"+i).addEventListener("input",e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,2))));

$("saveBtn").onclick = async () => {
  if(!isAdmin()) return;
  const msg=$("saveMsg"), date=$("date").value;
  const fail = t => { msg.className="msg err"; msg.textContent=t; };
  if(!date) return fail("Choose a date first.");
  if(date>todayStr()) return fail("Future dates are not allowed.");
  const vals={};
  for(const x of DRAWS){
    const v=[$("in_"+x[0]+"_0").value.trim(),$("in_"+x[0]+"_1").value.trim()];
    if(v[0]===""&&v[1]==="") continue;
    if(!v.every(n=>/^\d{1,2}$/.test(n) && +n<=MAX_NUMBER)) return fail(x[1]+" needs both numbers, from 00 to "+MAX_NUMBER+".");
    vals[x[0]] = v.map(n=>n.padStart(2,"0"));
  }
  if(!Object.keys(vals).length) return fail("Enter at least one number.");
  $("saveBtn").disabled=true; msg.className="msg"; msg.textContent="Saving...";
  try{
    adminCache = await mutate(d=>{ d[date]=Object.assign({},d[date],vals); });
    msg.className="msg ok"; msg.textContent="Posted for "+pretty(date)+"."+(useGit?" Saved to GitHub. The public page updates in about a minute.":"");
    fillInputs(); $("adminHist").innerHTML = histTable(adminCache,true);
  }catch(e){ fail(e.message); }
  $("saveBtn").disabled=false;
};
$("adminHist").addEventListener("click",async e=>{
  const d=e.target.dataset.del;
  if(!d || !confirm("Delete all numbers for "+pretty(d)+"?")) return;
  try{ adminCache = await mutate(x=>{ delete x[d]; }); fillInputs(); $("adminHist").innerHTML=histTable(adminCache,true); }
  catch(err){ $("saveMsg").className="msg err"; $("saveMsg").textContent=err.message; }
});

window.addEventListener("hashchange",route);
if(!location.hash) location.hash="#/display"; else route();
</script>
</body>
</html>
